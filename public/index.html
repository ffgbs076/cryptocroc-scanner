<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Forest BTC (Weekly)</title>
  <style>
    body{ margin:0; background:#0b0f14; color:#d6d6d6; font-family: -apple-system,system-ui,Segoe UI,Roboto,Arial; }
    .wrap{ max-width:1100px; margin:0 auto; padding:16px; }
    .row{ display:flex; gap:12px; flex-wrap:wrap; }
    .card{ background:#0e1117; border:1px solid #1f2a37; border-radius:12px; padding:12px; }
    #priceChart{ width:100%; height:420px; }
    #forestChart{ width:100%; height:220px; }
    .top{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
    .pill{ font-weight:700; }
    pre{ white-space:pre-wrap; word-break:break-word; }
    a{ color:#9cc3ff; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div style="font-size:18px;font-weight:800;">Forest BTC (Weekly)</div>
        <div id="meta" style="opacity:.8;font-size:13px;">Loading…</div>
      </div>
      <div>
        <span class="pill" id="statusPill">…</span>
      </div>
    </div>

    <div class="card">
      <div id="priceChart"></div>
    </div>

    <div style="height:12px;"></div>

    <div class="card">
      <div id="forestChart"></div>
    </div>

    <div style="height:12px;"></div>

    <div class="card">
      <div style="font-weight:700;margin-bottom:6px;">Debug</div>
      <pre id="debug"></pre>
    </div>
  </div>

  <!-- PIN v4: anders bestaat addCandlestickSeries niet -->
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <script defer src="/app.js"></script>
</body>
</html>
