<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CryptoCroc — BTC Forest</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://unpkg.com/lightweight-charts@5.0.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="dot"></div>
      <div>
        <div class="title">CryptoCroc Scanner</div>
        <div class="sub">BTC Weekly • Forest Line</div>
      </div>
    </div>

    <div class="status">
      <div id="statusPill" class="pill">Loading…</div>
      <div id="meta" class="meta"></div>
    </div>
  </header>

  <main class="wrap">
    <section class="panel">
      <div class="panelHeader">
        <h2>BTC Price (Candles)</h2>
        <div class="hint">Turning points = pijlen op candles</div>
      </div>
      <div id="priceChart" class="chart"></div>
    </section>

    <section class="panel">
      <div class="panelHeader">
        <h2>Forest Line (richting / golf)</h2>
        <div class="hint">Geen prijs-target — alleen bias</div>
      </div>
      <div id="forestChart" class="chart small"></div>
    </section>

    <section class="panel">
      <div class="panelHeader">
        <h2>Debug</h2>
        <div class="hint">Handig bij errors</div>
      </div>
      <pre id="debug" class="debug"></pre>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
