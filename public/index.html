<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Forest</title>
  <style>
    html, body { height: 100%; margin: 0; background:#0e1117; color:#d6d6d6; font-family: -apple-system, system-ui, Segoe UI, Roboto, Arial; }

<body>
  <div class="top">
    <div id="statusPill">Loading…</div>

  </div>

</html>
