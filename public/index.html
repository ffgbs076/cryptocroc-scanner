<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Forest</title>
  <style>
    :root { --bg:#0e1117; --fg:#d6d6d6; --muted:#8892a6; --good:#00c853; --bad:#ff5252; --mid:#f5c542; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family: -apple-system, system-ui, Segoe UI, Roboto, Arial; }
    .top { display:flex; gap:12px; align-items:center; padding:12px 14px; border-bottom:1px solid #222; }
    .pill { font-weight:700; }
    .meta { color:var(--muted); font-size:12px; }
    .wrap { display:grid; grid-template-rows: 56vh 28vh 1fr; gap:10px; padding:10px; }
    .panel { border:1px solid #222; border-radius:10px; overflow:hidden; }
    #priceChart, #forestChart { width:100%; height:100%; }
    pre { margin:0; padding:10px; color:#ff7777; overflow:auto; }
  </style>
</head>
<body>
  <div class="top">
    <div id="statusPill" class="pill">Loading…</div>
    <div id="probText" class="meta"></div>
    <div id="meta" class="meta"></div>
  </div>

  <div class="wrap">
    <div class="panel"><div id="priceChart"></div></div>
    <div class="panel"><div id="forestChart"></div></div>
    <div class="panel"><pre id="debug"></pre></div>
  </div>

  <!-- Belangrijk: deze build geeft createChart + addCandlestickSeries + addLineSeries -->
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <script src="/app.js"></script>
</body>
</html>
